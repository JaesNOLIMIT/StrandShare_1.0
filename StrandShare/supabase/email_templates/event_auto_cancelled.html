<!-- Template: event_auto_cancelled -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Program Application Cancelled</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Segoe UI,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:620px;background:#ffffff;border:1px solid #e4e4e7;border-radius:14px;overflow:hidden;">
            <tr><td style="height:6px;background:#570000;"></td></tr>
            <tr>
              <td style="padding:28px;">
                <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#71717a;">Donivra program application</div>
                <h1 style="margin:8px 0 12px;font-size:24px;line-height:1.3;">Your application was cancelled</h1>
                <p style="margin:0 0 18px;font-size:15px;line-height:1.65;color:#52525b;">{{message}}</p>
                <div style="padding:16px;border-radius:10px;background:#f4f4f5;">
                  <div style="font-size:12px;font-weight:700;color:#71717a;text-transform:uppercase;">Program</div>
                  <div style="margin-top:4px;font-size:16px;font-weight:700;">{{event_name}}</div>
                  <div style="margin-top:10px;font-size:13px;color:#52525b;"><strong>Proposed start:</strong> {{proposed_start_at}}</div>
                </div>
                <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#71717a;">You may submit a new application with a future program schedule.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
