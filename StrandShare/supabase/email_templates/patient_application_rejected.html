<!doctype html>
<html>
  <body style="margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#172033;">
    <div style="max-width:600px;margin:32px auto;background:#ffffff;border:1px solid #e4e7ec;border-radius:14px;padding:28px;">
      <p style="margin:0 0 8px;color:#b42318;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">Application decision</p>
      <h1 style="margin:0 0 12px;font-size:22px;">Patient application not accepted</h1>
      <p style="line-height:1.6;color:#596174;">Hello {{applicant_name}}, {{hospital_name}} reviewed application {{application_code}} and did not accept it.</p>
      <div style="margin:20px 0;padding:16px;border-radius:10px;background:#fff1f1;line-height:1.6;">
        <strong>Reason provided by the hospital</strong><br />
        {{decision_reason}}
      </div>
      <p style="margin:0;line-height:1.6;color:#596174;">No Donivra account or patient record was created.</p>
    </div>
  </body>
</html>
