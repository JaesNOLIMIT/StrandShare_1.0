<!doctype html>
<html>
  <body style="margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#172033;">
    <div style="max-width:560px;margin:32px auto;background:#ffffff;border:1px solid #e4e7ec;border-radius:14px;padding:28px;">
      <p style="margin:0 0 8px;color:#7a1020;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">Donivra patient application</p>
      <h1 style="margin:0 0 12px;font-size:22px;">Verify your email</h1>
      <p style="margin:0 0 20px;line-height:1.6;color:#596174;">Enter this code on the patient application page. Do not share it with anyone.</p>
      <div style="padding:18px;border-radius:10px;background:#f5eef0;text-align:center;font-size:30px;font-weight:700;letter-spacing:.25em;color:#650817;">{{otp_code}}</div>
      <p style="margin:18px 0 0;font-size:13px;color:#737b8c;">This code expires in {{expires_minutes}} minutes.</p>
    </div>
  </body>
</html>
